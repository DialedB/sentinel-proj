name: Sentinel checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - name: Lint and dependency consistency
        run: |
          ruff check sentinel tests
          ruff format --check sentinel tests
          python -m pip check
      - name: Unit and integration coverage (100 percent statements and branches)
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Bounded real-process regressions
        run: |
          python tests/smoke_pipeline.py
          python tests/smoke_recovery.py
          python tests/smoke_events.py
          python tests/smoke_communication.py
          python tests/smoke_watchdog.py
      - name: Compose syntax
        run: docker compose config --quiet
